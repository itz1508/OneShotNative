[project]
name = "oneshot"
version = "0.0.0"
description = "OneShot - system-owned responsibility workflow"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.14.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Playwright Python drives the real-browser E2E gates (tests/e2e_browser.py,
# tests/e2e_presend.py). It is optional because the Python unit tests and the
# HTTP E2E gates do not need a browser.
test = [
    "pytest>=8.0",
    "playwright>=1.44",
]

[tool.uv]
# The domain is imported as plain packages (systems/, capabilities/); nothing is
# published, so uv should manage dependencies without building/installing the
# project itself.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Note: do NOT pin --basetemp under .pytest_cache/. pytest 9 creates the basetemp
# with a non-recursive mkdir, while .pytest_cache/ itself is created lazily by the
# cache provider -- so a nested basetemp makes pytest error on a clean checkout.
# Pytest's default temp base always exists and needs no configuration.
addopts = "-q"