[project]
name = "oneshot"
version = "0.0.0"
description = "OneShot - system-owned responsibility workflow"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.14.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.uv]
# The domain is imported as plain packages (systems/, capabilities/); nothing is
# published, so uv should manage dependencies without building/installing the
# project itself.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_cache/tmp"